<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <style>
        .heading{
            justify-content: center;
            align-items: center;
        }
        nav{
            display: flex;
            justify-content: space-between;
        }
        nav a{
            text-decoration: none;
            color: black;
        }
        .form-container{
            display: flex;
            justify-content: center;
        }
        .form-login{
            display: flex;
            flex-direction: column;
            width: 50%;       
         }
         .form-login input{
            margin-top: 20px;
         }
         .calender{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            grid-template-rows: 30px repeat(6,50px);
            row-gap: 20px;
            column-gap: 10px;
         }
         .div, .day{
            background-color: skyblue;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
         }
         .day{
            background-color: lightgray;
            font-size: 1em;
         }
    </style>
</head>
<body>
    <header>
        <h3 class="heading">MAKING A LOGIN FORM USING FLEXBOX</h3>
        <nav>
            <div>
            <a href="">Home</a>
            <a href="">Profile</a>
            <a href="">Blog</a>
            <a href="">About</a>
            </div>
            <a href="">Login</a>
        
        </nav>
        <section class="form-container">
        <form class="form-login">
            <h3>Please Login</h3>
            <input type="email" name="" id="" placeholder="Your Email" required>

            <input type="password" name="" id="" placeholder="Your Password" required>

            <input type="submit" value="Login">

         </form>
         </section>

    </header>
    <main>
        <h3 class="heading">CREATE CALENDAR USING CSS GRID AND FLEXBOX</h3>
        <div class="calender">
            <div class="day">S</div>
            <div class="day">M</div>
            <div class="day">T</div>
            <div class="day">W</div>
            <div class="day">T</div>
            <div class="day">F</div>
            <div class="day">S</div>
             <div class="div">29</div>
            <div class="div">30</div>
            <div class="div">31</div>
            <div class="div">1</div>
            <div class="div">2</div>
            <div class="div">3</div>
            <div class="div">4</div>
            <div class="div">5</div>
            <div class="div">6</div>
            <div class="div">7</div>

            <div class="div">11</div>
            <div class="div">12</div>
            <div class="div">13</div>
            <div class="div">14</div>
            <div class="div">15</div>
            <div class="div">16</div>
            <div class="div">17</div>
            <div class="div">18</div>
            <div class="div">19</div>
            <div class="div">20</div>
            <div class="div">21</div>
            <div class="div">22</div>

    </main>
    <footer>

</body>
</html>
